<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — CyberZone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav>
            <div class="logo">CYBERZONE</div>
            <ul class="nav-links">
                <li><a href="index.html">Главная</a></li>
                <li><a href="start.html">Как начать?</a></li>
                <li><a href="about.html">О компании</a></li>
                <li><a href="login.html">Войти</a></li>
                <li><a href="register.html">Зарегистрироваться</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="form-container">
            <h2>Регистрация</h2>
            <form>
                <div class="form-group">
                    <label for="reg-name">Ваше имя</label>
                    <input type="text" id="reg-name" placeholder="Иван" required>
                </div>
                <div class="form-group">
                    <label for="reg-email">E-mail</label>
                    <input type="email" id="reg-email" placeholder="example@mail.com" required>
                </div>
                <div class="form-group">
                    <label for="reg-password">Пароль</label>
                    <input type="password" id="reg-password" placeholder="Придумайте пароль" required>
                </div>
                <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;">Создать аккаунт</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 CyberZone. Все права защищены.</p>
    </footer>

</body>
</html>
